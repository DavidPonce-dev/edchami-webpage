services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DISCORD_BOT_URL=http://bot:3002
    volumes:
      - project_images:/app/storage/img/projects
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  bot:
    build:
      context: ../discord-bot
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ADMIN_SERVER_PORT=3002
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  project_images:

networks:
  frontend:
  backend:
    internal: true
