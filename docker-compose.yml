services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Required - Auth
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # Required - App
      - NODE_ENV=${NODE_ENV:-production}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL}
      # Required - Database (Coolify injects these automatically)
      # Supports both DB_* and POSTGRES_* prefixes
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_HOST=${DB_HOST:-${POSTGRES_HOST:-db}}
      - DB_PORT=${DB_PORT:-${POSTGRES_PORT:-5432}}
      - DB_USER=${DB_USER:-${POSTGRES_USER:-postgres}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      - DB_NAME=${DB_NAME:-${POSTGRES_DB:-edchami_dev}}
      # Optional - Discord Bot
      - DISCORD_BOT_URL=${DISCORD_BOT_URL:-http://localhost:3002}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      # Optional - SEO
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION}
    volumes:
      - project_images:/app/storage/img/projects
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - backend

  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-${DB_USER:-postgres}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:-postgres}}
      - POSTGRES_DB=${POSTGRES_DB:-${DB_NAME:-edchami_dev}}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${DB_USER:-postgres}}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - backend

volumes:
  postgres_data:
  project_images:

networks:
  frontend:
  backend:
    internal: true
